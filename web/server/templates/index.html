<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Video Player</title>
</head>
<body>
    <div class=".container-fluid bg-light p-3 rounded" color="blue">
        <div class="row">
            <div class="col-9">
                <div class="container bg-dark p-1 rounded" id="videoContainer">
                    <video id="video" width="100%" height="100%" controls>
                        <source
                            id="videoSrc"
                            src="{{url_for('static', filename='saved_videos/short.mp4')}}"
                            type="video/mp4"
                        >
                        Your browser does not support the video tag.
                    </video>
                </div>
            </div>
            <div class="col-3" >
                <div id="tsList" class="card list-group" style="overflow-y: scroll;"></div>
            </div>
        </div>
    </div>
</body>
<script>
    const videoElement = document.getElementById("video");

    function updateTimeStamp(timestamp){
        var source = document.getElementById("videoSrc");
        var url = source.src;
        url = url.substring(0,url.indexOf(".mp4")+4);
        url += ("#t="+timestamp)
        source.setAttribute("src", url);

        var video = document.getElementById("video");
        var playing = !video.paused;
        console.log(playing);
        video.load();

        if(playing){
            video.play();
        }
    }
    function setListHeight() {
        let videoContainer = document.getElementById("videoContainer");
        let tsList = document.getElementById("tsList");
        let style = tsList.getAttribute("style")
        if (style.includes("height")) {
            let indexOfHeight = style.indexOf("height");
            let indexOfSC = style.indexOf(";", indexOfHeight);
            s1 = style.substring(0, indexOfHeight);
            s2 = style.substring(indexOfSC + 1);
            style = s1 + s2
        }
        let height = videoContainer.clientHeight
        style += `height:${height}px;`;
        tsList.setAttribute("style", style);
    }
    window.onresize = setListHeight;
    videoElement.addEventListener("loadeddata", () => {
        setListHeight();
    });

</script>
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
</html>
